<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body,#root{background:#09090f;min-height:100vh}
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;color:#dde0f0}
/* ── Block text selection everywhere except inputs ── */
*:not(input):not(textarea){-webkit-user-select:none;-moz-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
/* ── Modern thin scrollbar ── */
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2a42;border-radius:99px}
/* ── Range input ── */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:#1e1e32;border-radius:99px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;margin-top:-7px;cursor:pointer;background:#7b72e9;box-shadow:0 0 8px #7b72e960}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
/* ── Buttons ── */
button{font-family:'Inter',sans-serif;letter-spacing:-.01em;border:none;cursor:pointer;touch-action:manipulation}
button:active{opacity:.8;transform:scale(.96)}
/* ── Animations ── */
@keyframes fu{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes ci{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes su{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sh{0%{background-position:200% center}100%{background-position:-200% center}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
/* ── Card glass effect ── */
.glass-card{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
</style>
</head>
<body>
<div id="splash" style="position:fixed;inset:0;background:#09090f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999;transition:opacity .3s"><div style="font-weight:800;font-size:42px;letter-spacing:-2px;color:#dde0f0;line-height:1">High<span style="color:#7b72e9;font-weight:300;letter-spacing:.04em">Enough</span></div><div style="width:20px;height:20px;border:2px solid #1c1c2c;border-top-color:#7b72e9;border-radius:50%;animation:spin .55s linear infinite"></div></div>

<!-- Main app: React/JSX, processed by Babel standalone -->
<script type="text/babel" src="./js/app.js"></script>
<script src="./js/pwa.js"></script>
</body>
